name: Release Docs
# Manual only. `publish-image.yml` builds the same galleries and site on every
# push to main and is the pipeline Coolify pulls from, so this no longer runs on
# its own -- it would rebuild a multi-gigabyte wasm set twice per push. Kept so
# the GitHub Pages deployment can still be produced on demand, and safe to delete
# once the domain is served by Coolify.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

# Pages accepts one deployment at a time; queue rather than cancel so a
# dispatched deploy is never dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup nightly Rust for GPUI Base WASM
        run: |
          # Dated, matching crates/story-web/rust-toolchain.toml and the
          # Dockerfile: a moving channel can replace the installed wasm32 std
          # mid-build, which fails inside a container.
          rustup toolchain install nightly-2026-10-10 --profile minimal \
            --component rustfmt --component clippy
          rustup target add wasm32-unknown-unknown --toolchain nightly-2026-10-10

      - name: Install wasm-bindgen-cli
        # Keep the CLI version in sync with the `wasm-bindgen` crate in Cargo.lock
        run: |
          version=$(grep -A 1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d '"' -f 2)
          cargo install -f wasm-bindgen-cli --version "$version"

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/slint-component/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Story Web (WASM)
        working-directory: crates/story-web
        run: |
          make build-prod

      - name: Build GPUI Base examples (WASM)
        working-directory: crates/base/examples/wasm
        run: |
          make build

      - name: Build Slint gallery (WASM)
        working-directory: crates/slint-component
        run: |
          make build

      - name: Build Website
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun install
          bun run build

      - name: Copy WASM apps to Website
        run: |
          mkdir -p website/dist/gallery
          cp -r crates/story-web/www/dist/* website/dist/gallery/
          mkdir -p website/dist/examples/base
          cp -r crates/base/examples/wasm/www/dist/* website/dist/examples/base/
          mkdir -p website/dist/slint-gallery
          cp -r crates/slint-component/www/dist/* website/dist/slint-gallery/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "website/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
