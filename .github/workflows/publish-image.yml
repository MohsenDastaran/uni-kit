name: Publish Website Image

# The website serves three WebAssembly galleries that cannot be built on the
# deployment host: the Slint catalog's own build script asks for more than a
# 14 GiB machine, and the built galleries total several gigabytes. So the image
# is assembled here, where the runners have the memory, and Coolify only pulls
# the result.
#
# A release publishes it. A merge to main does not: this image is what Coolify
# serves, so what goes live should be a version someone chose rather than
# whatever landed last. Release events carry no `paths` filter, so the workflow
# runs for every release rather than only those touching the site.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-website-image
  # Releases are deliberate and rare, and each one is the only chance to publish
  # its image. Cancelling a build in flight would leave that release with no
  # artifact, so a later release waits rather than replacing an earlier one.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # GHCR rejects uppercase paths and the owner is `MohsenDastaran`.
          tags: ghcr.io/mohsendastaran/uni-kit-website:latest
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
