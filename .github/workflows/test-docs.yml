name: Test Docs
on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/test-docs.yml"
      - "crates/base/**"
      - "crates/story-web/**"
      - "crates/slint-component/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0
      - name: Install
        working-directory: website
        run: bun install
      - name: Build
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run build
          bun run test:seo
