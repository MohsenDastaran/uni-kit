name: Test Docs
on:
  pull_request:
    paths:
      - "website/**"
      - "registry/**"
      - ".github/workflows/test-docs.yml"
      - "crates/base/**"
      - "crates/blocks/**"
      - "crates/story-web/**"
      - "crates/slint-component/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0
      - name: Registry manifest is current
        # `components.json` is what `npx uni-kit add` installs from, and it is
        # generated from the Slint import graph. When an import changes and this is
        # not regenerated, `add` copies an incomplete set and the result does not
        # compile -- which is how thirteen components shipped broken once.
        run: |
          node registry/build-manifest.mjs
          git diff --exit-code registry/components.json website/src/lib/registry-slugs.json
      - name: Install
        working-directory: website
        run: bun install
      - name: Build
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run build
          bun run test:seo
