# Astro writes directory-style output -- `/component/button` becomes
# `/component/button/index.html` -- while `trailingSlash: 'never'` keeps links
# without the trailing slash. Resolving the index file explicitly serves that
# URL in one request instead of answering with a directory redirect first.
# The canonical host is the apex domain. A www request must not serve a second
# copy of the site or its discovery files; redirect it once, preserving the path.
server {
    listen 80;
    server_name www.uni-kit.dastaran.com;
    return 301 https://uni-kit.dastaran.com$request_uri;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Discovery files are public, plain by type, and never cached from a previous
    # deployment. Exact locations keep the generic try_files fallback from ever
    # turning a missing file into an HTML page.
    location = /robots.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        types { application/xml xml; }
        default_type application/xml;
        charset utf-8;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # The galleries ship a `.wasm.gz` beside each module (compressed at build
    # time), so nginx never compresses anything itself: the file is served as-is
    # when the client accepts gzip, and the transfer is ~2.5x smaller.
    gzip_static on;

    # Everything under these prefixes is either content-hashed or a built wasm
    # bundle, so a name never points at different bytes.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /pagefind/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Regex locations win over prefixes, so this also covers the gallery files
    # under `/gallery`, `/examples/base`, `/slint-gallery`, `/iced-gallery` and
    # `/nsh-gallery`. `gzip_static`
    # serves the pre-compressed `.gz` for these, so the cached entry must vary by
    # the encoding the reader accepted.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept-Encoding;
        try_files $uri =404;
    }

    location / {
        # Remove the old query-based framework URLs. The clean framework route
        # is canonical and can be indexed; the query form never reaches a page.
        if ($arg_framework) {
            rewrite ^/component(?:/(.*))?$ /frameworks/$arg_framework/$1? permanent;
        }
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # `application/wasm` is deliberately absent: the galleries are tens of
    # megabytes each, and compressing them on every request costs more than it
    # saves. The pre-compressed `.wasm.gz` files serve that need instead.
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;
}
