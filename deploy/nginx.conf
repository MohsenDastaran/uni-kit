# Astro writes directory-style output -- `/docs/test` becomes
# `/docs/test/index.html` -- while `trailingSlash: 'never'` keeps links without
# the trailing slash. Resolving the index file explicitly serves that URL in one
# request instead of answering with a directory redirect first.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The galleries ship a `.wasm.gz` beside each module (compressed at build
    # time), so nginx never compresses anything itself: the file is served as-is
    # when the client accepts gzip, and the transfer is ~2.5x smaller.
    gzip_static on;

    # Everything under these prefixes is either content-hashed or a built wasm
    # bundle, so a name never points at different bytes.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /pagefind/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Regex locations win over prefixes, so this also covers the gallery files
    # under `/gallery`, `/examples/base` and `/slint-gallery`. `gzip_static`
    # serves the pre-compressed `.gz` for these, so the cached entry must vary by
    # the encoding the reader accepted.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept-Encoding;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # `application/wasm` is deliberately absent: the galleries are tens of
    # megabytes each, and compressing them on every request costs more than it
    # saves. The pre-compressed `.wasm.gz` files serve that need instead.
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;
}
