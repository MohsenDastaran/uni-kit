<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uni-kit — iced</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--gallery-background, #ffffff);
        color: var(--gallery-foreground, #1f2328);
        font: 13px/1.5 system-ui, -apple-system, sans-serif;
      }
      #note {
        padding: 16px;
        max-width: 42em;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* The source view covers the gallery rather than sitting beside it: the
         frame the component pages embed is small, and a split would leave
         neither half usable. */
      #source-button {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 2;
        padding: 4px 10px;
        font: inherit;
        color: inherit;
        background: color-mix(in srgb, currentColor 8%, transparent);
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        border-radius: 6px;
        cursor: pointer;
      }
      #source-button[aria-pressed="true"] {
        background: color-mix(in srgb, currentColor 18%, transparent);
      }
      #source {
        position: fixed;
        inset: 0;
        z-index: 1;
        margin: 0;
        padding: 44px 16px 16px;
        overflow: auto;
        background: var(--gallery-background, #ffffff);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.6;
        tab-size: 4;
        white-space: pre;
      }
      #source[hidden] {
        display: none;
      }
    </style>
    <script>
      // The gallery is embedded in a component page, so it wears the host page's
      // theme rather than the reader's system preference: a light frame inside a
      // dark page is the one thing that always looks broken.
      //
      // The theme is read once, at load, because an iced application takes its
      // theme when it starts. A later change on the host page therefore reloads
      // this frame (see the observer below) — restarting the demo is honest,
      // where repainting a canvas the application thinks is light is not.
      (() => {
        let dark;
        try {
          const embedded = window.parent !== window;
          const root = embedded ? window.parent.document.documentElement : null;
          const stored = localStorage.getItem('theme');
          dark = root
            ? root.classList.contains('dark')
            : stored === 'dark' ||
              (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (root) {
            const style = window.parent.getComputedStyle(root);
            const background = style.getPropertyValue('--background').trim();
            const foreground = style.getPropertyValue('--foreground').trim();
            if (background) document.documentElement.style.setProperty('--gallery-background', background);
            if (foreground) document.documentElement.style.setProperty('--gallery-foreground', foreground);
          }
        } catch {
          dark = false;
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';

        // Watch the host page's theme class, and start over when it changes.
        const root = window.parent !== window ? window.parent.document.documentElement : null;
        if (root) {
          new MutationObserver(() => {
            const now = root.classList.contains('dark');
            if (now !== (document.documentElement.dataset.theme === 'dark')) location.reload();
          }).observe(root, { attributes: true, attributeFilter: ['class'] });
        }
      })();
    </script>
  </head>
  <body>
    <button id="source-button" type="button" aria-pressed="false">View source</button>
    <pre id="source" hidden><code></code></pre>
    <div id="note">Starting the gallery…</div>
    <script type="module">
      // One module answers for every component, the way the GPUI gallery does:
      // `?story=<registry key>` picks the demo, and the name is the same one the
      // registry and the CLI use, so `message-role` is `message-role` here too.
      const note = document.getElementById('note');
      const story = new URLSearchParams(location.search).get('story') ?? '';
      const dark = document.documentElement.dataset.theme === 'dark';

      // The page is served at `/iced-gallery?story=…` — a path with no trailing
      // slash, so `./iced_component.js` would resolve against the site root and
      // 404. Asking for the module beside the *directory* the page is mounted at
      // keeps this right under any prefix, including a project-site subpath.
      const mounted = location.pathname.replace(/\/+$/, '') + '/';

      const sourceButton = document.getElementById('source-button');
      const sourcePanel = document.getElementById('source');
      const sourceCode = sourcePanel.querySelector('code');
      const params = new URLSearchParams(location.search);
      let sourceLoaded = false;
      let sourcePromise = null;

      /** Show the Rust the gallery is running, fetching it the first time. */
      async function showSource() {
        if (!sourceLoaded) {
          sourcePromise ??= fetch(`${mounted}src/${story || 'index'}.rs`).then(
            async (response) =>
              response.ok
                ? await response.text()
                : `No source is served for "${story || '(no story)'}".\n\n` +
                  `Run \`make build-page\` in crates/iced-component to write the\n` +
                  `demos into www/dist/src, which is where this button reads them.`,
          );
          sourceCode.textContent = await sourcePromise;
          sourceLoaded = true;
        }
        sourcePanel.hidden = false;
        sourceButton.setAttribute('aria-pressed', 'true');
      }

      function hideSource() {
        sourcePanel.hidden = true;
        sourceButton.setAttribute('aria-pressed', 'false');
      }

      sourceButton.addEventListener('click', () => {
        if (sourcePanel.hidden) {
          showSource();
          // The page that embeds this gallery carries the example in its own
          // text, and saying which story was asked for lets it scroll there —
          // the way the GPUI gallery's source button behaves. The panel here is
          // what makes the button work on its own, in a tab or a frame.
          if (window.parent !== window) {
            window.parent.postMessage(
              { source: 'iced-component', title: story },
              location.origin,
            );
          }
        } else {
          hideSource();
        }
      });

      // `?source=1` opens it without a click: the view is linkable, and a check
      // can look at it without driving a pointer.
      if (params.get('source') === '1') showSource();

      try {
        const { default: init, run } = await import(mounted + 'iced_component.js');
        await init();
        // Hidden rather than removed: `run` does not return until the window
        // closes, so there is no moment after a successful start to clean up in,
        // and a browser that cannot give the application a GPU surface traps
        // inside that call. Leaving the element in place is what lets the catch
        // below say so instead of showing a blank rectangle.
        note.style.display = 'none';
        run(story, dark);
      } catch (error) {
        note.style.display = '';
        note.innerHTML =
          'The iced gallery could not start: <code>' +
          String(error) +
          '</code><br />A browser with WebGPU or WebGL is needed; ' +
          'in development, build it with <code>make dev:website-iced</code>.';
        throw error;
      }
    </script>
  </body>
</html>
