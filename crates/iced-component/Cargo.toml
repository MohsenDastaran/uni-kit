[package]
name = "iced-component"
description = "Hand-written iced versions of the uni-kit component catalog, and the gallery the website embeds."
version = "0.1.0"
license = "Apache-2.0"
publish = false
edition = "2024"

# Not a member of the GPUI Kit workspace: iced keeps its own lockfile, and the
# components are source an application copies rather than a crate it depends on.
[workspace]

[lib]
name = "iced_component"
path = "src/lib.rs"

[[bin]]
name = "iced-gallery"
path = "src/main.rs"

[dependencies]
# The version every component is written against, pinned to the minor release.
#
# The features are the ones the components draw with and none are in iced's
# defaults; `advanced` is what opens the core traits `text_view` implements. A
# plain `cargo add iced` installs a component that does not compile, so the CLI
# prints this exact line — `registry/index.js` and this file are kept in step by
# `crates/iced-component/scripts/check.sh`.
iced = { version = "0.14", features = ["svg", "canvas", "image", "qr_code", "markdown", "advanced"] }
# `text_view` is the one component that needs a second crate: it implements
# `Widget` itself, and iced exposes that trait only through `iced_core`. The CLI
# learns which components these are from `registry/build-manifest.mjs`, which
# reads the sources rather than trusting a list kept by hand.
iced_core = "0.14"

[profile.release]
# The browser has to compile this module before it shows anything, so the profile
# prefers small, single-unit code over build convenience.
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
# Debug info for the gallery's generated component tree is the largest thing rustc
# builds, and the default needs more memory than the CI container has.
debug = false
incremental = false
