[package]
name = "slint-component"
description = "Hand-written Slint versions of the GPUI Component catalog, and the gallery the website embeds."
version = "0.6.4"
license = "Apache-2.0"
publish = false
edition = "2024"

# Not a member of the GPUI Kit workspace: Slint keeps its own lockfile.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "slint-gallery"
path = "src/main.rs"

[dependencies]
slint = "1.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "=0.2.121"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "DomTokenList",
    "Element",
    "HtmlElement",
    "Location",
    "MediaQueryList",
    "MutationObserver",
    "MutationObserverInit",
    "Storage",
    "Window",
] }

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = "s"

# The gallery is one generated Rust file holding every example, and full debug
# info for it is the single largest thing rustc builds. Dropping it is what lets
# the whole-gallery build finish inside a cgroup cap that leaves the desktop
# room to breathe; with the default `debug = 2` the build needs more memory than
# the machine has. Incremental state is off for the same reason: it is another
# copy of that same enormous artifact on disk and in the compiler's memory.
[profile.dev]
debug = false
incremental = false
